name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Terraform root modules
        id: find
        run: |
          dirs="$(
            {
              echo bootstrap
              if [ -d stacks ]; then
                find stacks -mindepth 1 -maxdepth 1 -type d | sort
              fi
            } | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "Root modules: ${dirs}"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform -chdir="${DIR}" init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir="${DIR}" validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install TFLint
        run: curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: TFLint
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

  ci-passed:
    name: ci-passed
    if: always()
    needs: [discover, fmt, validate, tflint]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "A required CI job did not succeed." >&2
              exit 1
            fi
          done